spring:
  ai:
    deepseek:
      base-url: https://api.deepseek.com # DeepSeek 的请求 URL, 可不填，默认值为 api.deepseek.com
      api-key: sk-xxx # 填写 DeepSeek Api Key, 改成你自己的
      chat:
        model: deepseek-flash # 使用哪个模型
    openai:
      base-url: https://www.api.site/v1 # OpenAI 服务的访问地址，这里使用的第三方代理商
      api-key: xxx  # 填写接口 AI 的 API Key, 该成你自己的
      chat:
        model: gpt-6.1-sol # 模型名称
        temperature: 0.7 # 温度值
logging:
  level:
    org.springframework.ai.chat.client.advisor: debug
