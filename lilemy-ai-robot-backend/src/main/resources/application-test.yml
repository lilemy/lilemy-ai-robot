spring:
  cassandra:
    contactPoints: 127.0.0.1 # Cassandra 集群节点地址（可配置多个，用逗号分隔）
    port: 9042 # 端口号
    localDatacenter: datacenter1 # 必须与集群配置的数据中心名称一致（大小写敏感）
  ai:
    deepseek:
      base-url: https://api.deepseek.com # DeepSeek 的请求 URL, 可不填，默认值为 api.deepseek.com
      api-key: sk-xxx # 填写 DeepSeek Api Key, 改成你自己的
      chat:
        model: deepseek-flash # 使用哪个模型
    openai:
      base-url: https://www.api.site/v1 # OpenAI 服务的访问地址，这里使用的第三方代理商
      api-key: xxx  # 填写接口 AI 的 API Key, 该成你自己的
      chat:
        model: gpt-6.1-sol # 模型名称
        temperature: 0.7 # 温度值
    chat:
      memory:
        repository:
          cassandra:
            keyspace: lilemy_ai_robot # 指定存储聊天记忆的 Keyspace（类似数据库名）
            table: ai_chat_memory # 表名
            time-to-live: 1095d # 数据的自动过期时间（1095天 ≈ 3年）
            initialize-schema: true  # 自动初始化表结构
logging:
  level:
    org.springframework.ai.chat.client.advisor: debug
